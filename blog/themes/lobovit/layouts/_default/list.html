{{ define "main" }}
<div class="list-page">
  <div class="section-label">// {{ .Title }}</div>
  <h1>{{ .Title }}</h1>
  {{ range .Pages }}
  <a href="{{ .RelPermalink }}" class="post-item">
    <div class="post-left">
      <div class="post-title">{{ .Title }}</div>
      {{ with .Description }}<div class="post-desc">{{ . }}</div>{{ end }}
    </div>
    <div class="post-right">
      {{ with .Params.tags }}
      <span class="post-tag {{ range $i, $tag := . }}{{ if eq (lower $tag) "go" }}tag-go{{ else if eq (lower $tag) "rust" }}tag-rust{{ else if or (eq (lower $tag) "performance") (eq (lower $tag) "perf") }}tag-perf{{ else }}tag-default{{ end }}{{ end }}">{{ index . 0 | lower }}</span>
      {{ end }}
      {{ if ne (.Date.Format "2006-01-02") "0001-01-01" }}
      <span class="post-date">{{ .Date.Format "2006-01-02" }}</span>
      {{ end }}
    </div>
  </a>
  {{ end }}
</div>
{{ end }}
