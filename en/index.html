<script>
  mermaid.initialize({ startOnLoad: false, theme: 'base', themeVariables: {
    fontFamily: '"Inter", system-ui, sans-serif',
    fontSize: '14px',
    primaryColor: '#1e1e28',
    primaryTextColor: '#d4d4e0',
    primaryBorderColor: '#25252f',
    lineColor: '#7c9aff',
    secondaryColor: '#13131a',
    tertiaryColor: '#18181f'
  }});
  document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('code.language-mermaid').forEach(function(el) {
      var mDiv = document.createElement('div');
      mDiv.className = 'mermaid';
      mDiv.textContent = el.textContent;
      var wrap = el.closest('.src-mermaid') || el.closest('.src') || el.closest('.highlight') || el.parentElement;
      if (wrap) wrap.replaceWith(mDiv);
    });
    mermaid.run();
  });
</script>
  <button class="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">^ top</button>
  <script>
    document.querySelectorAll('.content table').forEach(function(t) {
      if (t.closest('.table-wrapper')) return;
      var w = document.createElement('div');
      w.className = 'table-wrapper';
      t.parentNode.insertBefore(w, t);
      w.appendChild(t);
    });
  </script>
  <script>
    var btn = document.querySelector('.back-to-top');
    var progress = document.getElementById('reading-progress');
    window.addEventListener('scroll', function() {
      btn.classList.toggle('visible', window.scrollY > 400);
      var scrollTop = window.scrollY;
      var docHeight = document.documentElement.scrollHeight - window.innerHeight;
      var scrollPercent = (scrollTop / docHeight) * 100;
      progress.style.width = scrollPercent + '%';
    });
  </script>
